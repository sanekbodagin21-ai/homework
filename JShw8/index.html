<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <script defer src="./js/main.js"></script>
    <title>Todo</title>
</head>
<body>
    <div class="app">
        <h1 class="title">СПИСОК ДЕЛ</h1>
        <form class="form">
            <input class="input" type="text" name="new-todo" placeholder="Новая задача..." autocapitalize="off" required>
            <button class="button button-create">Добавить задачу</button>
        </form>
        <ul class="todos">
            <li class="todo">
                <div class="todos-text">Задача 1</div>
                <p class="todos-year">Год создания</p>
                <div class="todos-actions">
                    <button class="button-complete button">&#10004;</button>
                    <button class="button-delete button">&#10006;</button>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
